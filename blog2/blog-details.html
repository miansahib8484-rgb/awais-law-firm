*{

body{

background:#fff;

header{
background:#1e1614;

display:flex;

}

.logo{

#blogMeta{

.container{

#blogImage{

display:none;
border-radius:14px;
margin-bottom:35px;
object-fit:cover;
box-shadow:0 10px 30px rgba(0,0,0,.12);
}

#blogContent{
font-size:18px;
line-height:2;
color:#444;
}

#blogContent h2,
#blogContent h3{
font-family:'Playfair Display',serif;
margin:35px 0 15px;
color:#222;
}

#blogContent p{
margin-bottom:18px;
}

#blogContent img{
max-width:100%;
height:auto;
border-radius:12px;
margin:30px 0;
}

#blogContent ul,
#blogContent ol{
padding-left:22px;
margin-bottom:20px;

.loading{

font-size:22px;
