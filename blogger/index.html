<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Some thing else here</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script src="auth.js" defer></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;
}

body{

background:linear-gradient(135deg,#0f172a,#1e293b,#2563eb);

height:100vh;

display:flex;

justify-content:center;

align-items:center;

overflow:hidden;

}

.login-box{

width:430px;

background:white;

padding:45px;

border-radius:18px;

box-shadow:0 20px 50px rgba(0,0,0,.25);

}

.logo{

text-align:center;

margin-bottom:35px;

}

.logo h1{

font-size:34px;

color:#0f172a;

margin-bottom:8px;

}

.logo p{

color:#64748b;

font-size:15px;

}

.form-group{

margin-bottom:22px;

}

label{

display:block;

margin-bottom:8px;

font-weight:600;

color:#334155;

}

input{

width:100%;

height:50px;

padding:15px;

border:1px solid #d1d5db;

border-radius:10px;

font-size:15px;

outline:none;

transition:.3s;

}

input:focus{

border-color:#2563eb;

box-shadow:0 0 8px rgba(37,99,235,.25);

}

button{

width:100%;

height:52px;

border:none;

border-radius:10px;

background:#2563eb;

color:white;

font-size:17px;

font-weight:bold;

cursor:pointer;

transition:.3s;

}

button:hover{

background:#1d4ed8;

}

#message{

margin-top:20px;

text-align:center;

font-weight:600;

font-size:15px;

}

.success{

color:#16a34a;

}

.error{

color:#dc2626;

}

@media(max-width:500px){

.login-box{

width:95%;

padding:25px;

}

}

</style>

</head>
  <body>

<div class="login-box">

    <div class="logo">

        <h1>BLOGGER CMS</h1>

        <p>Awais Law Associates</p>

    </div>

    <form id="loginForm">

        <div class="form-group">

            <label>Email Address</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required>

        </div>

        <div class="form-group">

            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required>

        </div>

        <button
            type="submit"
            id="loginBtn">

            Login

        </button>

        <div id="message"></div>

    </form>

</div>

</body>

</html>
